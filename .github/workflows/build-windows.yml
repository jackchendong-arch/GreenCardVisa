name: Build Windows App

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp CI build version
        shell: bash
        run: |
          VERSION=$(node -e "const pkg = require('./package.json'); const [major, minor] = pkg.version.split('.'); process.stdout.write([major, minor, process.env.GITHUB_RUN_NUMBER].join('.'));")
          npm version --no-git-tag-version "$VERSION"

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GreenCardVisa-windows-${{ github.sha }}
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
