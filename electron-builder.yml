appId: com.jackchendong.greencardvisa
productName: GreenCardVisa
compression: maximum
directories:
  output: dist
files:
  - main.js
  - preload.js
  - index.html
  - package.json
asar: true
win:
  artifactName: '${productName}-${version}-${arch}-setup.${ext}'
  electronLanguages:
    - en-US
    - zh-CN
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  packElevateHelper: false
